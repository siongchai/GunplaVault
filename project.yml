name: GunplaVault
options:
  bundleIdPrefix: com.gunplavault
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  GunplaVault:
    type: application
    platform: iOS
    sources:
      - path: GunplaVault
        excludes:
          - "**/*.json"
          - "**/*.storekit"
      - path: GunplaVault/Resources/Assets.xcassets
        buildPhase: resources
      - path: GunplaVault/Resources/SeedData/seed_kits.json
        buildPhase: resources
      - path: GunplaVault/Resources/Config/Secrets.example.plist
        buildPhase: resources
      - path: GunplaVault/Resources/Config/Secrets.plist
        buildPhase: none
        optional: true
      - path: GunplaVault/Resources/StoreKit/GunplaVaultPro.storekit
        buildPhase: none
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gunplavault.app
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Gunpla Vault
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_BackgroundColor: LaunchBackground
        INFOPLIST_KEY_UILaunchScreen_UIColorName: LaunchBackground
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: "Gunpla Vault uses the camera to scan kit boxes."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Gunpla Vault accesses photos for your build journal and shelves."
    dependencies:
      - package: Supabase
        product: Supabase

schemes:
  GunplaVault:
    build:
      targets:
        GunplaVault: all
    run:
      config: Debug
      storeKitConfiguration: GunplaVault/Resources/StoreKit/GunplaVaultPro.storekit
